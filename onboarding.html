<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Started Free | Tradebook Trading Journal</title>
    <meta
      name="description"
      content="Start your trading journal in under a minute. Track stocks, forex, and crypto trades, and get the numbers that show you what's really working."
    />
    <link rel="shortcut icon" href="/images/favicon.ico" />
    <link rel="icon" href="/images/favicon.ico" sizes="any" />
    <link
      rel="icon"
      href="/images/icon-192.png"
      type="image/png"
      sizes="192x192"
    />
    <link rel="apple-touch-icon" href="/images/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111111" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loadingScreen" class="loading-screen">Loading Tradebook…</div>

    <!-- EMAIL VERIFIED -->
    <div id="verifiedScreen" class="auth-screen hidden">
      <div class="auth-card" style="text-align: center">
        <div
          style="
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(46, 158, 91, 0.15);
            color: #2e9e5b;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
          "
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            style="width: 28px; height: 28px"
          >
            <path d="M20 6L9 17l-5-5" />
          </svg>
        </div>
        <h2 class="auth-title display" style="font-size: 26px">
          Email verified successfully
        </h2>
        <p class="auth-desc" style="margin-bottom: 24px">
          Your account is confirmed. You're all set to continue to Tradebook.
        </p>
        <button type="button" class="btn-primary" id="verifiedContinueBtn">
          Continue to Tradebook
        </button>
      </div>
    </div>

    <!-- AUTH -->
    <div id="authScreen" class="auth-screen hidden">
      <div class="auth-card">
        <div class="auth-eyebrow">Welcome</div>
        <h2 class="auth-title display">TRADEBOOK</h2>
        <div class="auth-tabs">
          <button class="auth-tab-btn active" data-authtab="login">
            Log in
          </button>
          <button class="auth-tab-btn" data-authtab="signup">Sign up</button>
        </div>

        <button type="button" class="btn-google" id="googleAuthBtn">
          <svg viewBox="0 0 48 48">
            <path
              fill="#FFC107"
              d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"
            />
            <path
              fill="#FF3D00"
              d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"
            />
            <path
              fill="#4CAF50"
              d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"
            />
            <path
              fill="#1976D2"
              d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"
            />
          </svg>
          Continue with Google
        </button>
        <div class="auth-divider">or</div>

        <form id="loginForm">
          <div class="field">
            <label class="field-label">Email</label>
            <input
              class="field-input"
              id="loginEmail"
              type="email"
              placeholder="you@email.com"
              required
            />
          </div>
          <div class="field">
            <label class="field-label">Password</label>
            <div class="password-field-wrap">
              <input
                class="field-input"
                id="loginPassword"
                type="password"
                placeholder="••••••••"
                required
              />
              <button
                type="button"
                class="pw-eye-btn"
                data-toggle-pw="loginPassword"
                aria-label="Show password"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  data-eye-icon="loginPassword"
                >
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <div class="auth-error" id="loginError"></div>
          <button type="submit" class="btn-primary" id="loginSubmitBtn">
            Log in
          </button>
        </form>

        <form id="signupForm" class="hidden">
          <div class="field">
            <label class="field-label">Name</label>
            <input
              class="field-input"
              id="signupName"
              placeholder="Daniel"
              required
            />
          </div>
          <div class="field">
            <label class="field-label">Email</label>
            <input
              class="field-input"
              id="signupEmail"
              type="email"
              placeholder="you@email.com"
              required
            />
          </div>
          <div class="field">
            <label class="field-label">Password</label>
            <div class="password-field-wrap">
              <input
                class="field-input"
                id="signupPassword"
                type="password"
                placeholder="At least 6 characters"
                required
                minlength="6"
              />
              <button
                type="button"
                class="pw-eye-btn"
                data-toggle-pw="signupPassword"
                aria-label="Show password"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  data-eye-icon="signupPassword"
                >
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <div class="pw-strength-meter">
              <div class="pw-strength-meter-fill" id="pwStrengthFill"></div>
            </div>
            <div class="pw-strength-label" id="pwStrengthLabel"></div>
          </div>
          <div class="auth-error" id="signupError"></div>
          <div class="auth-info" id="signupInfo"></div>
          <button type="submit" class="btn-primary" id="signupSubmitBtn">
            Create account
          </button>
        </form>

        <form id="otpForm" class="hidden">
          <div class="field">
            <label class="field-label">Verification code</label>
            <input
              class="field-input"
              id="otpCode"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              placeholder="123456"
              required
            />
          </div>
          <div class="hint" style="margin-bottom: 12px">
            Enter the 6-digit code we emailed to
            <span id="otpEmailLabel" style="color: var(--text)"></span>.
          </div>
          <div class="auth-error" id="otpError"></div>
          <button type="submit" class="btn-primary" id="otpSubmitBtn">
            Verify email
          </button>
          <button
            type="button"
            class="btn-link"
            id="otpResendBtn"
            style="margin-top: 12px; display: block"
          >
            Resend code
          </button>
        </form>
      </div>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
